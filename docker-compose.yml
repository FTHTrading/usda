version: '3.8'

services:
  usda-rural-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: usda-3fs-workspace
    restart: unless-stopped
    ports:
      - "4080:4080"
    environment:
      - PORT=4080
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4080/"]
      interval: 30s
      timeout: 5s
      retries: 3
