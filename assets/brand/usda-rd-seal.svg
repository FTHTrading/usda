<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="USDA Rural Development">
  <defs>
    <linearGradient id="usdaShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#002D62"/>
      <stop offset="1" stop-color="#001838"/>
    </linearGradient>
    <linearGradient id="usdaGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5A800"/>
      <stop offset="1" stop-color="#C28200"/>
    </linearGradient>
    <linearGradient id="soilGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E7E34"/>
      <stop offset="1" stop-color="#145523"/>
    </linearGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="57" fill="url(#usdaShield)" stroke="url(#usdaGold)" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(245,168,0,0.35)" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Furrows / Hill Field Arc -->
  <path d="M 22 72 Q 60 52 98 72 L 98 84 Q 60 74 22 84 Z" fill="url(#soilGreen)"/>
  <path d="M 30 76 Q 60 62 90 76" fill="none" stroke="#F5A800" stroke-width="1.2" opacity="0.8"/>
  
  <!-- Foundation Gable Roof / Rural Architecture Silhouette -->
  <polygon points="60,26 84,48 78,48 78,66 42,66 42,48 36,48" fill="#FFFFFF" opacity="0.95"/>
  <polygon points="60,34 74,48 46,48" fill="#002D62"/>
  <rect x="56" y="52" width="8" height="14" fill="#002D62"/>
  
  <!-- Authority Lettering Arc & Subtitle -->
  <text x="60" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">USDA · RD</text>
  <text x="60" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5" font-weight="700" fill="#F5A800" text-anchor="middle" letter-spacing="1.2">SEC 502 SINGLE-CLOSE</text>
</svg>
